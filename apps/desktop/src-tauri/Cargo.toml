[package]
name = "xyra-desktop"
version = "0.1.0"
description = "Native Windows shell: WebView2 UI, supervised local sidecar, keychain secret broker"
edition = "2021"
rust-version = "1.85"
publish = false
default-run = "xyra-desktop"

[lib]
name = "xyra_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "xyra-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# Compiled in but never registered: no endpoint or pubkey until distribution and signing are approved (ADR-0008).
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
base64 = "0.22"
ring = "0.17"
zeroize = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Authentication_Identity",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
